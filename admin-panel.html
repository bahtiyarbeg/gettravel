<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Gettravel</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        .header h1 { font-size: 2rem; margin-bottom: 10px; }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover { background: #5568d3; }
        .btn-success { background: #48bb78; color: white; }
        .btn-danger { background: #f56565; color: white; }
        .tours-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .tour-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .tour-card h3 { margin-bottom: 10px; color: #1a202c; }
        .tour-card p { color: #718096; margin-bottom: 15px; font-size: 0.9rem; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2d3748;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
        }
        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .stat-card h2 {
            font-size: 2.5rem;
            color: #667eea;
            margin-bottom: 10px;
        }
        .stat-card p {
            color: #718096;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-umbrella-beach"></i> Gettravel Admin Panel</h1>
            <p>Tour management — easy add and edit</p>
        </div>

        <div class="stats" id="stats"></div>

        <div style="margin-bottom: 20px;">
            <button class="btn btn-primary" onclick="openAddModal()">
                <i class="fas fa-plus"></i> Add New Tour
            </button>
        </div>

        <div class="tours-grid" id="toursGrid"></div>
    </div>

    <!-- Modal -->
    <div class="modal" id="tourModal">
        <div class="modal-content">
            <h2 id="modalTitle">Add Tour</h2>
            <form id="tourForm" onsubmit="saveTour(event)">
                <input type="hidden" id="tourId">
                
                <div class="form-group">
                    <label>Tour Name *</label>
                    <input type="text" id="title" required placeholder="e.g.: Emperor Cruise 5★">
                </div>
                
                <div class="form-group">
                    <label>Subtitle *</label>
                    <input type="text" id="subtitle" required placeholder="e.g.: Luxury Yacht Dinner Cruise">
                </div>
                
                <div class="form-group">
                    <label>Full Description *</label>
                    <textarea id="description" required placeholder="Detailed tour description..."></textarea>
                </div>
                
                <div class="form-group">
                    <label>Photo URL (hero image) *</label>
                    <input type="url" id="image" required placeholder="https://...">
                </div>
                
                <div class="form-group">
                    <label>Duration</label>
                    <select id="duration">
                        <option value="Half Day">Half Day</option>
                        <option value="Full Day">Full Day</option>
                        <option value="4.5 Hours">4.5 Hours</option>
                        <option value="2 Days / 1 Night">2 Days / 1 Night</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Category</label>
                    <select id="category">
                        <option value="Island Hopping">Island Hopping</option>
                        <option value="Nature">Nature</option>
                        <option value="Luxury">Luxury</option>
                        <option value="Adventure">Adventure</option>
                        <option value="Culture">Culture</option>
                        <option value="Beach">Beach</option>
                        <option value="Spa & Wellness">Spa & Wellness</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Status</label>
                    <select id="status">
                        <option value="active">Active</option>
                        <option value="draft">Draft</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
                
                <div class="actions">
                    <button type="button" class="btn btn-danger" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i> Save
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let tours = [];
        let editingId = null;

        // Load tours
        async function loadTours() {
            try {
                const response = await fetch('/tables/tours?limit=100');
                const data = await response.json();
                tours = data.data || [];
                renderTours();
                updateStats();
            } catch (error) {
                console.error('Error loading tours:', error);
                tours = [];
                renderTours();
            }
        }

        // Render tours
        function renderTours() {
            const grid = document.getElementById('toursGrid');
            if (tours.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #718096;">No tours yet. Add your first tour!</p>';
                return;
            }
            
            grid.innerHTML = tours.map(tour => `
                <div class="tour-card">
                    <h3>${tour.title || 'Untitled'}</h3>
                    <p>${tour.subtitle || ''}</p>
                    <div style="display: flex; gap: 10px; margin-bottom: 10px; font-size: 0.85rem;">
                        <span><i class="fas fa-clock"></i> ${tour.duration || 'N/A'}</span>
                        <span><i class="fas fa-tag"></i> ${tour.category || 'N/A'}</span>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-primary" style="flex: 1;" onclick="editTour('${tour.id}')">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                        <button class="btn btn-danger" onclick="deleteTour('${tour.id}')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Statistics
        function updateStats() {
            const stats = document.getElementById('stats');
            const active = tours.filter(t => t.status === 'active').length;
            const draft = tours.filter(t => t.status === 'draft').length;
            
            stats.innerHTML = `
                <div class="stat-card">
                    <h2>${tours.length}</h2>
                    <p>Total Tours</p>
                </div>
                <div class="stat-card">
                    <h2>${active}</h2>
                    <p>Active</p>
                </div>
                <div class="stat-card">
                    <h2>${draft}</h2>
                    <p>Drafts</p>
                </div>
            `;
        }

        // Open add modal
        function openAddModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Add New Tour';
            document.getElementById('tourForm').reset();
            document.getElementById('tourModal').classList.add('active');
        }

        // Edit tour
        function editTour(id) {
            const tour = tours.find(t => t.id === id);
            if (!tour) return;
            
            editingId = id;
            document.getElementById('modalTitle').textContent = 'Edit Tour';
            document.getElementById('tourId').value = tour.id;
            document.getElementById('title').value = tour.title || '';
            document.getElementById('subtitle').value = tour.subtitle || '';
            document.getElementById('description').value = tour.description || '';
            document.getElementById('image').value = tour.image_url || '';
            document.getElementById('duration').value = tour.duration || 'Full Day';
            document.getElementById('category').value = tour.category || 'Island Hopping';
            document.getElementById('status').value = tour.status || 'active';
            
            document.getElementById('tourModal').classList.add('active');
        }

        // Save tour
        async function saveTour(event) {
            event.preventDefault();
            
            const tourData = {
                title: document.getElementById('title').value,
                subtitle: document.getElementById('subtitle').value,
                description: document.getElementById('description').value,
                image_url: document.getElementById('image').value,
                duration: document.getElementById('duration').value,
                category: document.getElementById('category').value,
                status: document.getElementById('status').value,
                featured: false,
                adult_price: 0,
                child_price: 0,
                included_items: [],
                excluded_items: [],
                itinerary: ''
            };
            
            try {
                if (editingId) {
                    // Update
                    await fetch(`/tables/tours/${editingId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(tourData)
                    });
                    alert('Tour updated!');
                } else {
                    // Create
                    await fetch('/tables/tours', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(tourData)
                    });
                    alert('Tour created!');
                }
                
                closeModal();
                loadTours();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // Delete tour
        async function deleteTour(id) {
            if (!confirm('Are you sure you want to delete this tour?')) return;
            
            try {
                await fetch(`/tables/tours/${id}`, { method: 'DELETE' });
                alert('Tour deleted!');
                loadTours();
            } catch (error) {
                alert('Delete error: ' + error.message);
            }
        }

        // Close modal
        function closeModal() {
            document.getElementById('tourModal').classList.remove('active');
        }

        // Load on startup
        loadTours();
    </script>
</body>
</html>
